services:
  db:
    image: postgres:16-alpine
    container_name: saes-postgres
    environment:
      POSTGRES_DB: saes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - saes-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saes-postgres-data:
