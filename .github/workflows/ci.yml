# Integration continue : chaque pull request vers main (et chaque fusion) doit
# compiler et passer tous les tests, backend et frontend, avant d'etre fusionnee.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, tests sur PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: saes-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compile, applique les migrations Flyway sur une PostgreSQL 16 jetable
      # (Testcontainers, Docker est disponible sur le runner) et lance les tests.
      - name: Compiler et tester
        run: ./mvnw -B --no-transfer-progress verify

      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: saes-backend/target/surefire-reports/

  frontend:
    name: Frontend (build de production et tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: saes-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: saes-frontend/.nvmrc
          cache: npm
          cache-dependency-path: saes-frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Tests unitaires
        run: npx ng test --watch=false
