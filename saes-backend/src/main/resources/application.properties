spring.application.name=saes-backend
server.port=8080

saes.cors.allowed-origins=http://localhost:4200

# PostgreSQL (choix_techniques_architecture.pdf : seule base retenue, pour la
# contrainte d'exclusion sur les reservations). Demarrer la base avec
# "docker compose up -d" depuis la racine du depot avant de lancer le backend.
spring.datasource.url=jdbc:postgresql://localhost:5432/saes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schema est entierement gere par Flyway (db/migration) : Hibernate ne doit
# jamais le modifier lui-meme.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# Jeton JWT : cle de signature et duree de vie (12h). A surcharger en
# production via la variable d'environnement SAES_JWT_SECRET.
saes.jwt.secret=${SAES_JWT_SECRET:changez-cette-cle-en-production-au-moins-256-bits-svp}
saes.jwt.expiration-minutes=720
