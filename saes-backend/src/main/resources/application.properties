spring.application.name=saes-backend
server.port=8080

saes.cors.allowed-origins=http://localhost:4200

# PostgreSQL (choix_techniques_architecture.pdf : seule base retenue, pour la
# contrainte d'exclusion sur les reservations). Installation : voir README.md.
spring.datasource.url=jdbc:postgresql://localhost:5432/saes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schema est entierement gere par Flyway (db/migration) : Hibernate ne doit
# jamais le modifier lui-meme.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# Jeton JWT : cle de signature (au moins 32 caracteres) et duree de vie (12h).
# Pas de valeur par defaut : sans la variable d'environnement SAES_JWT_SECRET,
# le serveur refuse de demarrer (le profil dev fournit une cle de developpement).
saes.jwt.secret=${SAES_JWT_SECRET}
saes.jwt.expiration-minutes=720
