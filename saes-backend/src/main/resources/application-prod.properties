# Profil de production : lancer avec SPRING_PROFILES_ACTIVE=prod (docker-compose.prod.yml).
# Pas de donnees de test (DataSeeder n'existe qu'en profil dev). Tous les secrets
# viennent des variables d'environnement : voir .env.example.

# Le serveur est derriere le reverse proxy HTTPS (Caddy) : on fait confiance a
# ses en-tetes X-Forwarded-* pour connaitre le schema (https) et l'adresse du client.
server.forward-headers-strategy=framework

# Jamais de requetes SQL ni de details d'erreur dans les journaux ou les reponses.
spring.jpa.show-sql=false
server.error.include-stacktrace=never
server.error.include-message=never

# Le pool de connexions attend la base plutot que d'echouer au premier essai.
spring.datasource.hikari.initialization-fail-timeout=60000
