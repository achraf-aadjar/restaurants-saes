<section class="card">
  <h1>SAES Restaurants</h1>
  <p class="lede">
    Frontend Angular pret. Verifie la liaison avec l'API Spring Boot.
  </p>

  <button type="button" (click)="checkBackend()" [disabled]="loading()">
    {{ loading() ? 'Verification...' : 'Tester /api/ping' }}
  </button>

  @if (ping(); as p) {
    <p class="ok">
      {{ p.service }} — {{ p.status }} — {{ p.timestamp }}
    </p>
  }

  @if (error(); as e) {
    <p class="ko">{{ e }}</p>
  }
</section>
