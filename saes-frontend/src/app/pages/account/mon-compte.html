<section class="carte formulaire-etroit">
  <h1>Mon compte</h1>

  @if (erreur(); as e) {
    <p class="message-refus">{{ e }}</p>
  }
  @if (succes(); as s) {
    <p class="message-ok">{{ s }}</p>
  }

  <form (ngSubmit)="enregistrer()" #f="ngForm">
    <div class="champ">
      <label for="prenom">Prénom</label>
      <input id="prenom" name="prenom" type="text" required [(ngModel)]="prenom" />
    </div>

    <div class="champ">
      <label for="nom">Nom</label>
      <input id="nom" name="nom" type="text" required [(ngModel)]="nom" />
    </div>

    <div class="champ">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" required [(ngModel)]="email" />
    </div>

    <div class="champ">
      <label for="telephone">Téléphone</label>
      <input id="telephone" name="telephone" type="tel" [(ngModel)]="telephone" />
    </div>

    <div class="champ">
      <label for="nouveauMotDePasse">Nouveau mot de passe (facultatif)</label>
      <input
        id="nouveauMotDePasse"
        name="nouveauMotDePasse"
        type="password"
        minlength="8"
        [(ngModel)]="nouveauMotDePasse"
        autocomplete="new-password"
      />
    </div>

    <div class="champ">
      <label for="motDePasseActuel">Mot de passe actuel (obligatoire pour en changer)</label>
      <input
        id="motDePasseActuel"
        name="motDePasseActuel"
        type="password"
        [required]="!!nouveauMotDePasse"
        [(ngModel)]="motDePasseActuel"
        autocomplete="current-password"
      />
    </div>

    <button type="submit" class="btn btn-primaire" [disabled]="f.invalid || enCours()">
      {{ enCours() ? 'Enregistrement…' : 'Enregistrer' }}
    </button>
  </form>
</section>

@if (estClientSeul()) {
  <section class="carte formulaire-etroit zone-danger">
    <h2>Supprimer mon compte</h2>
    @if (!confirmationSuppression()) {
      <button type="button" class="btn btn-secondaire" (click)="confirmationSuppression.set(true)">
        Supprimer mon compte
      </button>
    } @else {
      <p>Cette action est définitive. Confirmez-vous la suppression de votre compte ?</p>
      <div class="actions-danger">
        <button
          type="button"
          class="btn btn-primaire"
          [disabled]="enCours()"
          (click)="supprimerCompte()"
        >
          Oui, supprimer
        </button>
        <button
          type="button"
          class="btn btn-secondaire"
          (click)="confirmationSuppression.set(false)"
        >
          Annuler
        </button>
      </div>
    }
  </section>
}
