<section class="entete-page sur-sombre">
  <div class="entete-interieur">
    <span class="sur-titre">En images</span>
    <h1>Photos</h1>
    <p class="chapeau">Les plats de la carte et le restaurant de l'EPT.</p>
  </div>
</section>

<section class="bloc" aria-label="Galerie de photos">
  <ul class="galerie">
    @for (photo of galerie; track photo.base + $index) {
      <li>
        <button type="button" class="vignette" (click)="ouvrir(photo)">
          <img
            [src]="sources(photo).src"
            [srcset]="sources(photo).srcset"
            sizes="(min-width: 60rem) 22rem, 45vw"
            width="400"
            height="400"
            loading="lazy"
            [alt]="photo.legende"
          />
          <span class="legende">{{ photo.legende }}</span>
        </button>
      </li>
    }
  </ul>
</section>

@if (ouverte(); as photo) {
  <div
    class="voile"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="photo.legende"
    tabindex="-1"
    (click)="fermer()"
    (keydown.escape)="fermer()"
  >
    <figure (click)="$event.stopPropagation()">
      <img
        [src]="sources(photo).src"
        [srcset]="sources(photo).srcset"
        sizes="90vw"
        [alt]="photo.legende"
      />
      <figcaption>{{ photo.legende }}</figcaption>
      <button type="button" class="fermer btn btn-secondaire btn-petit" (click)="fermer()">
        Fermer
      </button>
    </figure>
  </div>
}
